<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mockup — Draft · Need vs Tax</title>
<link rel="stylesheet" href="mockup-shared.css" />
<style>
  .chips { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
  .chip {
    min-height: var(--control-h-sm);
    padding: 0 var(--space-3);
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--text-secondary);
    font-size: var(--text-xs);
    font-weight: 650;
  }
  .chip.is-on { background: var(--accent); border-color: transparent; color: #fff; }
  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: var(--space-3);
    align-items: center;
    padding: var(--space-3) 0;
    border-top: 1px solid var(--border);
  }
  .tax { margin: var(--space-1) 0 0; color: var(--text-muted); font-size: var(--text-xs); }
  .tax.is-pressure { color: var(--tone-caution-text); }
</style>
</head>
<body>
<div class="concept-banner">
  <div><strong>Draft (live)</strong> <span>· Need vs Tax · SCORE-82</span></div>
  <nav class="concept-nav">
    <a href="index.html">All mocks</a>
    <a class="is-on" href="need-tax.html">Need vs Tax</a>
  </nav>
</div>

<div class="mock-viewport">
  <section class="mock-hero">
    <p class="mock-kicker">Player pool</p>
    <h1>Need fills your hole. Tax spends theirs.</h1>
    <p class="support">Same rail. Tax puts the richest rival hole on top. Nominate is still the only write.</p>
  </section>

  <section class="card">
    <div class="chips" role="radiogroup" aria-label="Who to put up">
      <button type="button" class="chip">Need · QB TE</button>
      <button type="button" class="chip is-on">Tax</button>
    </div>
    <div class="row">
      <div>
        <strong>Trey McBride</strong>
        <p class="tax">Alex has $88 at TE</p>
      </div>
      <button type="button" class="btn btn-primary">Nominate</button>
    </div>
    <div class="row">
      <div>
        <strong>Brock Purdy</strong>
        <p class="tax is-pressure">Chris has $12 at QB</p>
      </div>
      <button type="button" class="btn btn-ghost">Nominate</button>
    </div>
  </section>
</div>
</body>
</html>
