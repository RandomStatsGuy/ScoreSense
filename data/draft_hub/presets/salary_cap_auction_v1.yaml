id: salary_cap_auction_v1
label: Salary cap auction ($200)
description: Nomination auction with position mins/maxes and 1–3 year contracts.
salary_cap: 200
auction:
  min_bid: 1
  nomination_timer_sec: 60
  bid_timer_sec: 30
  bid_extension_sec: 5
  bot_reaction_delay_sec: 4
  allow_mid_draft_cuts: true
roster:
  qb: { min: 2, max: 4, starter: 1 }
  rb: { min: 4, max: 8, starter: 2 }
  wr: { min: 4, max: 8, starter: 2 }
  te: { min: 1, max: 3, starter: 1 }
  k: { min: 0, max: 2, starter: 1 }
  def: { min: 0, max: 2, starter: 1 }
  flex: { starter: 1, eligible: [RB, WR, TE] }
roster_size_max: 27
contracts:
  max_years: 3
  cut_refund_pct: 0.5
  extension_step_up: 5
  rookie_years: 2
  one_renewal_after_rookie: true
  allow_veteran_renewal: false
