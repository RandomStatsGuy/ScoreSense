id: snake_draft_v1
label: Snake draft
description: Classic snake draft with a pick clock. No salary cap — players are picked, not bought.
draft_type: snake
salary_cap: 0
auction:
  min_bid: 1
  nomination_timer_sec: 60
  bid_timer_sec: 30
  bid_extension_sec: 5
  bot_reaction_delay_sec: 4
  allow_mid_draft_cuts: false
roster:
  qb: { min: 1, max: 3, starter: 1 }
  rb: { min: 2, max: 8, starter: 2 }
  wr: { min: 2, max: 8, starter: 2 }
  te: { min: 1, max: 3, starter: 1 }
  k: { min: 1, max: 2, starter: 1 }
  def: { min: 1, max: 2, starter: 1 }
  flex: { starter: 1, eligible: [RB, WR, TE] }
roster_size_max: 16
contracts:
  max_years: 1
  cut_refund_pct: 0
  extension_step_up: 0
  rookie_years: 1
  veteran_years: 1
  rookie_salary_static: true
  one_renewal_after_rookie: false
  allow_veteran_renewal: false
