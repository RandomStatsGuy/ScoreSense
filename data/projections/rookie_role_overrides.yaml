# Manual rookie role multipliers for camp battles and unclear depth charts.
# Matched on player name + team (+ optional position). Replaces the Sleeper tier
# unless sentiment_blend is false. YouTube role-hype still applies when true.
#
# role_mult: scales the low-usage backup feature template (same units as Sleeper tiers).
# Typical range: 0.20 (deep development) to 2.8 (day-one starter).
# Draft capital note: Sleeper search_rank is used as a capital proxy in code; these
# overrides capture landing-spot / camp consensus beyond raw depth chart.

