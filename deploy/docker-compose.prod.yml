# Production stack — run from repo root:
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Only data/ and artifacts/ are mounted (no live source mounts).

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../artifacts:/app/artifacts
    environment:
      - PYTHONPATH=/app
      - AUTH_REQUIRED=${AUTH_REQUIRED:-true}
      - HUB_AUTH_REQUIRED=${HUB_AUTH_REQUIRED:-true}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  refresh:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../artifacts:/app/artifacts
    environment:
      - PYTHONPATH=/app
    command: python -m src.jobs.weekly_refresh --no-retrain
    profiles:
      - cron
