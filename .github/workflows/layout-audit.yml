name: Layout audit

# Measurable craft checks. Skip drafts. Only pay when shared primitives move.
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    branches: [develop, master]
    paths:
      - "frontend/src/styles/**"
      - "frontend/src/DraftHub/HubUILayout.jsx"
      - "scripts/dev/layout_audit.mjs"
      - "frontend/src/livingSurfaces.js"
      - ".github/workflows/layout-audit.yml"

concurrency:
  group: layout-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install API
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Install frontend and Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start API and Vite
        run: bash scripts/dev/start_hub_dev.sh
      - name: Audit living-surface routes at 1280
        working-directory: frontend
        run: |
          mkdir -p ../artifacts
          npm run audit:layout -- --all --width 1280 --json | tee ../artifacts/layout-audit-1280.json
      - name: Audit living-surface routes at 390
        working-directory: frontend
        run: npm run audit:layout -- --all --width 390 --json | tee ../artifacts/layout-audit-390.json
      - name: Upload audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-audit-json
          path: artifacts/layout-audit-*.json
