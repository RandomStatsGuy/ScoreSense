name: Deploy to VPS

on:
  push:
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        # appleboy/ssh-action@v1.2.5 — pin to commit SHA so the tag cannot be retargeted
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Docker image rebuild can exceed the action default (10m)
          command_timeout: 30m
          script: |
            set -euo pipefail

            # Documented production path (AGENTS.md / docs/DEPLOY_CLOUDFLARE_TUNNEL.md)
            cd /root/scoresense

            # Preserve host runtime state that must not be wiped by a hard reset.
            # .env is gitignored (survives reset). draft_hub.db is tracked in git
            # but the live league DB on the VPS must not be replaced by the repo copy.
            # Draft Hub uses SQLite WAL — stop writers, checkpoint, then back up a
            # single consistent main DB so reset/restore cannot pair a new main
            # file with stale -wal/-shm sidecars.
            if [ -f deploy/docker-compose.prod.yml ]; then
              docker compose -f deploy/docker-compose.prod.yml stop api || true
            fi

            DB_BACKUP=""
            if [ -f data/draft_hub/draft_hub.db ]; then
              DB_BACKUP="$(mktemp /tmp/scoresense-draft-hub.XXXXXX.db)"
              if command -v sqlite3 >/dev/null 2>&1; then
                sqlite3 data/draft_hub/draft_hub.db "PRAGMA wal_checkpoint(TRUNCATE);"
                sqlite3 data/draft_hub/draft_hub.db ".backup '$DB_BACKUP'"
              else
                cp -a data/draft_hub/draft_hub.db "$DB_BACKUP"
              fi
              rm -f data/draft_hub/draft_hub.db-wal data/draft_hub/draft_hub.db-shm
            fi

            # VPS working trees are often dirty with generated artifacts/data.
            # Hard-reset to origin/master so deploys are deterministic.
            git fetch origin master
            git checkout master
            git reset --hard origin/master

            if [ -n "$DB_BACKUP" ] && [ -f "$DB_BACKUP" ]; then
              mkdir -p data/draft_hub
              cp -a "$DB_BACKUP" data/draft_hub/draft_hub.db
              rm -f data/draft_hub/draft_hub.db-wal data/draft_hub/draft_hub.db-shm
              rm -f "$DB_BACKUP"
            fi

            # Rebuild frontend inside the image and recreate the API container
            bash deploy/server/deploy-on-server.sh
