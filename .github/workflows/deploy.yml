name: Deploy to VPS

on:
  push:
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        # appleboy/ssh-action@v1.2.5 — pin to commit SHA so the tag cannot be retargeted
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Docker image rebuild can exceed the action default (10m)
          command_timeout: 30m
          script: |
            set -euo pipefail

            # Documented production path (AGENTS.md / docs/DEPLOY_CLOUDFLARE_TUNNEL.md)
            cd /root/scoresense

            # Preserve host runtime state that must not be wiped by a hard reset.
            # .env is gitignored (survives reset). draft_hub.db is tracked in git
            # but the live league DB on the VPS must not be replaced by the repo copy.
            # Draft Hub uses SQLite WAL — stop writers, checkpoint, then back up a
            # single consistent main DB so reset/restore cannot pair a new main
            # file with stale -wal/-shm sidecars.
            #
            # Projection artifacts are the same class of live state: /api/refresh
            # rewrites artifacts/draft_pool and weekly_predictions with a fresh
            # built_at, but those files are also tracked in git (June 2026 copies).
            # Hard-reset without a restore puts the UI back to “57 days ago”.
            if [ -f data/draft_hub/draft_hub.db ] && [ ! -f deploy/docker-compose.prod.yml ]; then
              echo "error: deploy/docker-compose.prod.yml missing; refuse DB backup without stopping API" >&2
              exit 1
            fi
            if [ -f deploy/docker-compose.prod.yml ]; then
              # Must succeed: a failed stop must not continue to WAL checkpoint /
              # sidecar removal while the API may still hold the DB open.
              docker compose -f deploy/docker-compose.prod.yml stop api
            fi

            git fetch origin master

            # Keep in sync with scripts/ops/preserve_runtime_artifacts.py.
            ART_BACKUP="$(mktemp -d /tmp/scoresense-proj-artifacts.XXXXXX)"
            for rel in \
              artifacts/draft_pool \
              artifacts/weekly_predictions \
              artifacts/ros_predictions \
              artifacts/player_context \
              artifacts/injury_overlays \
              artifacts/weekly_projection_changes \
              artifacts/predictions \
              data/processed/qb_mlready.parquet \
              data/processed/rb_mlready.parquet \
              data/processed/wr_mlready.parquet \
              data/processed/qb_mlready.csv \
              data/processed/rb_mlready.csv \
              data/processed/wr_mlready.csv
            do
              if [ -e "$rel" ]; then
                mkdir -p "$ART_BACKUP/$(dirname "$rel")"
                cp -a "$rel" "$ART_BACKUP/$rel"
              fi
            done

            DB_BACKUP=""
            if [ -f data/draft_hub/draft_hub.db ]; then
              DB_BACKUP="$(mktemp /tmp/scoresense-draft-hub.XXXXXX.db)"
              if command -v sqlite3 >/dev/null 2>&1; then
                sqlite3 data/draft_hub/draft_hub.db "PRAGMA wal_checkpoint(TRUNCATE);"
                sqlite3 data/draft_hub/draft_hub.db ".backup '$DB_BACKUP'"
              else
                # Host often lacks sqlite3 CLI; use the API image (Python stdlib) so we
                # always checkpoint WAL into a single consistent backup file.
                docker compose -f deploy/docker-compose.prod.yml run --rm --no-deps \
                  -v "$DB_BACKUP:/backup.db" \
                  api python -c "import sqlite3; s=sqlite3.connect('/app/data/draft_hub/draft_hub.db'); s.execute('PRAGMA wal_checkpoint(TRUNCATE)'); d=sqlite3.connect('/backup.db'); s.backup(d); d.close(); s.close()"
              fi
              rm -f data/draft_hub/draft_hub.db-wal data/draft_hub/draft_hub.db-shm
            fi

            # VPS working trees are often dirty with generated artifacts/data.
            # Hard-reset to origin/master so deploys are deterministic, then put
            # live projection artifacts back on top of the committed fallbacks.
            git checkout master
            git reset --hard origin/master

            if [ -n "$DB_BACKUP" ] && [ -f "$DB_BACKUP" ]; then
              mkdir -p data/draft_hub
              cp -a "$DB_BACKUP" data/draft_hub/draft_hub.db
              rm -f data/draft_hub/draft_hub.db-wal data/draft_hub/draft_hub.db-shm
              rm -f "$DB_BACKUP"
            fi

            if [ -d "$ART_BACKUP" ]; then
              cp -a "$ART_BACKUP"/. .
              rm -rf "$ART_BACKUP"
            fi

            # Rebuild frontend inside the image and recreate the API container
            bash deploy/server/deploy-on-server.sh
