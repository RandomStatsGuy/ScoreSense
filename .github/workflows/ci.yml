name: CI

# Keep unit tests, but avoid burning Actions minutes on every intermediate
# agent push while a PR is still a draft.
on:
  push:
    branches: [master, develop]
    paths:
      - "app/**"
      - "src/**"
      - "frontend/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    branches: [develop, master]
    paths:
      - "app/**"
      - "src/**"
      - "frontend/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Draft PRs are for iteration. Run CI when the PR is ready (or on
    # push to protected integration branches).
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: PYTHONPATH=. python -m pytest tests/ -q
