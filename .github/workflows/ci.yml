name: CI

# Draft PRs are for iteration — do not burn Actions minutes until Ready.
# No push trigger: a change already paid for CI on the develop PR; merging
# again to develop/master used to reinstall the world a second and third time.
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    branches: [develop, master]
    paths:
      - "app/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-ci.txt"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run tests
        run: PYTHONPATH=. python -m pytest tests/ -q
