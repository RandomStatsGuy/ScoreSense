[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scoresense"
version = "2.0.0"
description = "NFL fantasy performance prediction"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "nfl_data_py>=0.3.0",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "streamlit>=1.28.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
desktop = ["PyQt5>=5.15.0", "pandasgui>=0.2.14"]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*", "bdb_companion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
